name: Nightly failure auto-diagnosis

# When the nightly run fails, its report-failure job files an issue (label nightly-failure). This workflow then has
# Claude diagnose that issue the way the project investigates any failure, post the diagnosis on the issue, and --
# when it finds a fix it can show is right -- open a DRAFT pull request for review. Nothing merges or deploys
# automatically: the owner reviews, and approves (or not).
#
# Issue #1740: a nightly job that hit its time limit makes the run "cancelled", not "failure"; that is diagnosed too (as a
# runtime question, see the prompt).
#
# Triggered by the nightly run completing (an issue created with GITHUB_TOKEN cannot trigger workflows itself), or
# by hand for one issue (Actions -> Nightly failure auto-diagnosis -> Run workflow -> the issue number).

on:
  workflow_run:
    workflows: ["Nightly generated days and real-HA tier"]
    types: [completed]
  workflow_dispatch:
    inputs:
      issue:
        description: "The nightly-failure issue number to diagnose"
        required: true

concurrency:
  group: nightly-autofix
  cancel-in-progress: false

jobs:
  diagnose:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - name: Find the issue for this failure
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_ISSUE: ${{ github.event.inputs.issue }}
        run: |
          set -euo pipefail
          gh label create needs-human --color FBCA04 --description "Auto-diagnosis found no fix it could show; needs a person" 2>/dev/null || true
          if [ -n "${INPUT_ISSUE:-}" ]; then
            num="$INPUT_ISSUE"
            run_id=$(gh issue view "$num" --json body,comments --jq '[.body, (.comments[].body)] | join("\n")' \
              | grep -oE 'nightly-run: [0-9]+' | tail -1 | cut -d' ' -f2 || true)
          else
            run_id="$RUN_ID"
            num=$(gh issue list --state open --label nightly-failure --search "\"nightly-run: $RUN_ID\"" \
              --json number --jq '.[0].number // empty')
          fi
          if [ -z "${num:-}" ]; then echo "No open nightly-failure issue for run ${run_id:-?}; nothing to do."; exit 0; fi
          # one fix per issue: skip when an open PR already says it fixes this issue
          if [ -n "$(gh pr list --state open --search "\"Fixes #$num\" in:body" --json number --jq '.[0].number // empty')" ]; then
            echo "An open PR already fixes #$num; nothing to do."; exit 0
          fi
          echo "issue=$num" >> "$GITHUB_OUTPUT"
          echo "run_id=${run_id:-}" >> "$GITHUB_OUTPUT"

      - name: Checkout main
        if: ${{ steps.find.outputs.issue }}
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up uv (uv reads the Python version from .python-version)
        if: ${{ steps.find.outputs.issue }}
        uses: astral-sh/setup-uv@v10.4.0

      - name: Install the test environment
        if: ${{ steps.find.outputs.issue }}
        run: uv sync --locked --only-group test

      - name: Diagnose and propose a fix
        id: claude
        if: ${{ steps.find.outputs.issue }}
        uses: anthropics/claude-code-action@v1
        with:
          # Workload identity federation (see claude.yml): no stored Claude credential.
          anthropic_federation_rule_id: fdrl_01P4ZqjLfXnfTiQVQihCUZAd
          anthropic_organization_id: 57f44af8-9979-4335-97d0-0230a761ca09
          anthropic_service_account_id: svac_01217po5WfFdad84kSxqXQbc
          anthropic_workspace_id: wrkspc_01BEPQrHwk2aMtjxDxxm3f82
          additional_permissions: |
            actions: read
          claude_args: >-
            --max-turns 150
            --allowedTools "Bash(gh:*),Bash(git:*),Bash(uv:*),Bash(python:*),Bash(python3:*),Bash(grep:*),Bash(sed:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Read,Edit,Write,Glob,Grep"
          prompt: |
            You are investigating a failed nightly run of Climate Advisor (a Home Assistant integration) in
            ${{ github.repository }}. The failure is tracked in issue #${{ steps.find.outputs.issue }}
            (nightly run id: ${{ steps.find.outputs.run_id }}). Work on a branch; never on main.

            Follow the project's own method (read these first: claude.md, docs/00-PROJECT-INSTRUCTIONS.md and the
            Tier 2/3 doc its Anchors table routes to for the failing area). Docs first, then logs, then code.

            1. Evidence first. Read the issue (`gh issue view ${{ steps.find.outputs.issue }} --comments`) and the
               failed logs (`gh run view ${{ steps.find.outputs.run_id }} --log-failed`). Reproduce locally:
               unit tests with `uv run --locked --only-group test python scripts/test.py unit <test path>`, the
               real-HA tier with `python3 scripts/test.py ha <tests_ha/... path>` (relative tests_ha paths only),
               generated days with the replay command the log prints (`python tools/simulate.py --replay-generated ...`).
               A failure you cannot reproduce: say so, and look for load/flakiness evidence (e.g. a pytest-timeout
               "CA real-HA: TIMEOUT" line, a worker crash) before calling it a product bug.
            2. Root cause with data: name the file:line, show the evidence (log lines, a reproduction). Trace the
               regression origin (`git log -p -S "<fragment>" -- <file>`): regression (name the PR) or design gap.
               Do the symmetry/mirror check from claude.md for the opposite code path.
            3. Post ONE diagnosis comment on the issue, in plain English, occupant first: what the person at home
               would experience, the cause, the evidence, and the fix you propose (or why there is none).
            4. Only when you have a fix you can demonstrate:
               - branch `nightly-fix/issue-${{ steps.find.outputs.issue }}`;
               - fix the cause (not the test); add a regression test and PROVE it fails without the fix (revert the
                 fix, run it, restore) — say so in the PR;
               - claude.md "Release Process": bump VERSION in custom_components/climate_advisor/const.py and
                 manifest.json to the next patch after main's, add a CHANGELOG.md entry, and append
                 fix_history via `python tools/add_fix_entry.py --issue ${{ steps.find.outputs.issue }} ...`;
               - every new occupant-facing string goes in the translation catalogs in all 16 languages
                 (docs/i18n-spec.md) and `python tools/i18n.py check` passes;
               - run the affected tests and `uv run --locked --only-group test python tools/validate.py`; they pass;
               - commit, push, and open a DRAFT PR (`gh pr create --draft`) whose body starts with
                 "Fixes #${{ steps.find.outputs.issue }}." and fills in every section of
                 .github/pull_request_template.md (what changes for the person at home, evidence, root cause and
                 origin, states covered, blast radius, mirror check, verification with the proof the tests fail
                 without the fix, housekeeping), so it passes the submission check (CONTRIBUTING.md).
               If you cannot demonstrate a fix, open no PR: comment the diagnosis and run
               `gh issue edit ${{ steps.find.outputs.issue }} --add-label needs-human`.

            A TIMEOUT is a failure too. If the issue says a job "timed out or was cancelled after <duration>" (the run
            is then "cancelled", and `--log-failed` may show nothing), the diagnosis is about RUNTIME, not a test:
            - which job and which shard (the generated-days job is 4 shards, "generated-days (shard N/4)", each with
              its own 120-minute cap; the per-seed timing lines `master_seed=...: N days in S s` and `peak_rss` are in
              its log: `gh run view ${{ steps.find.outputs.run_id }} --log --job <job id>`);
            - how long it ran and how that compares with earlier runs: `gh run list --workflow nightly.yml
              --limit 14 --json databaseId,conclusion,createdAt` then
              `gh run view <id> --json jobs --jq '.jobs[] | [.name, .conclusion, .startedAt, .completedAt] | @tsv'`;
              say whether it is a slow runner (the same seeds took longer than before), a shard that drew
              unusually slow days, or growth in the code's per-day cost;
            - what grew: find the change that made a day slower (`git log` over tools/sim_harness/ and
              custom_components/climate_advisor/ since the last run with normal timings; the perf-report-<shard>
              artifact lists CPU per executor job and loop callback), and a proposal (a faster path, a fewer-days
              default, more shards). Raising a timeout or editing the workflow is not yours to do (the hard rules
              below): propose it in the diagnosis comment for the owner. If the run's time is simply the runner's
              noise and nothing grew, say so and open no PR.

            Hard rules (from claude.md and the owner):
            - NO AI attribution anywhere: no "Co-Authored-By" trailer, no "Generated with Claude Code" line, in
              commits, PR bodies or comments.
            - Never merge, approve, or enable auto-merge; never deploy; never push to main; never edit
              .github/workflows/ or tools/simulations/golden/ (goldens are locked); never weaken or delete a test to
              make it pass. A change to the harness assertion layer (tools/sim_harness/outcomes.py) needs an explicit
              justification of why the old semantics were wrong.
            - Never print or read secrets (.deploy.env, tokens, /run/secrets).
            - A setpoint gap under 4 F (narrow gap) is a warned user configuration: excuse those outcomes, never
              change the engine for them.

      # Issue #1625: the action hides Claude's output (this repo is public), so a failed run used to say only
      # "is_error:true". This step pulls out JUST the error message from the execution file -- never the
      # transcript -- redacts anything token-like, names the kind of failure, and tells the issue what to do.
      - name: Report why the diagnosis could not run
        if: ${{ failure() && steps.find.outputs.issue }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ steps.find.outputs.issue }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          python3 .github/scripts/autodiag_failure.py > "$RUNNER_TEMP/autodiag_comment.md"
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/autodiag_comment.md" || true
          gh issue edit "$ISSUE" --add-label needs-human || true
