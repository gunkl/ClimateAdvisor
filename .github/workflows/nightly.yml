name: Nightly generated days and real-HA tier

# Issue #1128 I11 / epic #1125 Step 3. The unit tier runs a small fixed sample of generated
# household days on every PR; this workflow explores far more of them with fresh seeds, and
# re-runs the real Home Assistant tier, so a regression that only a rare day triggers is found
# overnight instead of by a customer. A failing run uploads the replayable scenario files.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      seeds:
        description: "Number of master seeds"
        default: "12"
      days:
        description: "Generated days per master seed"
        default: "250"

jobs:
  # Issue #1278: the seeds are picked once and shared, so the P1-P7 and P8 jobs judge the same master seeds.
  seeds:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      list: ${{ steps.seeds.outputs.list }}
      days: ${{ steps.seeds.outputs.days }}
    steps:
      - name: Pick fresh master seeds (printed so a failure is replayable)
        id: seeds
        env:
          INPUT_SEEDS: ${{ github.event.inputs.seeds }}
          INPUT_DAYS: ${{ github.event.inputs.days }}
        run: |
          count="${INPUT_SEEDS:-12}"
          days="${INPUT_DAYS:-250}"
          case "$count" in ''|*[!0-9]*) echo "seeds must be a positive integer, got '$count'" >&2; exit 1;; esac
          case "$days" in ''|*[!0-9]*) echo "days must be a positive integer, got '$days'" >&2; exit 1;; esac
          if [ "$count" -lt 1 ] || [ "$count" -gt 100 ] || [ "$days" -lt 1 ] || [ "$days" -gt 5000 ]; then
            echo "seeds must be 1-100 and days 1-5000" >&2; exit 1
          fi
          base=$(( (GITHUB_RUN_NUMBER % 1000) * 1000 ))
          list=""
          for i in $(seq 1 "$count"); do list="$list $((base + i))"; done
          echo "list=${list# }" >> "$GITHUB_OUTPUT"
          echo "days=$days" >> "$GITHUB_OUTPUT"
          echo "Master seeds: ${list# }"

  # Issue #1278: 12 x 250 days took 76 min on a hosted runner (about 1.5 s/day). P8 used to run after it in the
  # same job and would have pushed the job past its cap, so it is its own job now (run in parallel), and the cap
  # leaves headroom. If a run nears it, read the per-seed timings and peak_rss in the log; do not just raise it.
  # Issue #1728: --perf-report defers GC, so peak_rss here reads about 300 MB high; judge memory from a plain run.
  # Issue #1730: the perf report subtracts nested executor spans from the loop/task/callback rows, times scheduler
  # callbacks, and adds a generated heavy household (7-day forecast, v4 model) as household_* rows. Report only.
  generated-days:
    needs: seeds
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      issues: read  # Issue #1153: the waiver ledger checks each waiver's issue is still open

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv (uv reads the Python version from .python-version)
        uses: astral-sh/setup-uv@v10.4.0

      - name: Install test dependencies
        run: uv sync --locked --only-group test

      # Issue #1153: a known hit is tolerated only through tools/sim_harness/nightly_waivers.json - issue-linked,
      # expiring, matched on mechanism (never seed). A closed issue, a passed expiry or a waiver whose hit no
      # longer occurs fails this step. GITHUB_SHA / GITHUB_REPOSITORY are set by Actions; the token reads issues.
      - name: Generated days judged by the household promises (P1-P7) and the waiver ledger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          uv run --locked --only-group test python tools/simulate.py
          --generate ${{ needs.seeds.outputs.days }}
          --seeds ${{ needs.seeds.outputs.list }}
          --waiver-ledger tools/sim_harness/nightly_waivers.json
          --issue-state github
          --perf-report perf_report.json

      # Issue #1728: report only. The step above also records thread CPU per executor job and loop callback (GC
      # excluded) and prints the table at the end of its log; this uploads the JSON. It never fails the job, and
      # the probe never changes the run's results or exit status. No budget is enforced yet.
      - name: Upload performance report (report only)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.2
        with:
          name: perf-report
          path: perf_report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload failing scenarios
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: generated-failures
          path: tools/simulations/generated/failures/
          if-no-files-found: ignore
          retention-days: 30

  surfaces:
    needs: seeds
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv (uv reads the Python version from .python-version)
        uses: astral-sh/setup-uv@v10.4.0

      - name: Install test dependencies
        run: uv sync --locked --only-group test

      - name: Generated days judged by surfaces_agree (P8, ratcheted)
        run: >
          uv run --locked --only-group test python tools/simulate.py
          --surfaces --generate 50
          --seeds ${{ needs.seeds.outputs.list }}

  ha-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv (uv reads the Python version from .python-version)
        uses: astral-sh/setup-uv@v10.4.0

      - name: Run real-HA lifecycle tests
        env:
          # Issue #1518: with timeout_method = thread a timed-out test ends its process; under xdist the worker is
          # replaced and the run goes on (a serial run would abort at the first timeout). Same as validate.yml.
          CA_HA_WORKERS: "4"
        run: python3 scripts/test.py ha  # uv run --locked --only-group test-ha (own venv)

  # Issue #1278: a failed scheduled run only shows in the Actions tab, so every failure is filed as an issue.
  # One issue per distinct failure (the signature is the sorted list of failing tests, or the failed job names
  # when no test line is found); a later run with the same signature comments on that issue instead. The issue is
  # what .github/workflows/nightly-autofix.yml diagnoses (it finds it by the hidden nightly-run marker). A runner
  # killed for memory reports "failure" or "cancelled", so both count.
  report-failure:
    needs: [seeds, generated-days, surfaces, ha-lifecycle]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    steps:
      - name: File (or update) the issue for this failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SEEDS: ${{ needs.seeds.result }}
          GENERATED: ${{ needs.generated-days.result }}
          SURFACES: ${{ needs.surfaces.result }}
          HA: ${{ needs.ha-lifecycle.result }}
        run: |
          set -euo pipefail
          gh label create nightly-failure --color B60205 --description "Filed automatically by a failed nightly run" 2>/dev/null || true
          # The failing tests, from the logs of the jobs that failed (this run is still in progress, so per job).
          jobs=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | "\(.id) \(.name)"')
          : > failing.txt
          : > promises.txt
          while read -r id name; do
            [ -z "$id" ] && continue
            gh run view --job "$id" --log 2>/dev/null > job.log || true
            grep -oE '(FAILED|ERROR) (tests|tests_ha)/[^ ]+' job.log | sed -E 's/^(FAILED|ERROR) //' >> failing.txt || true
            # generated days: an unwaived household-promise hit ("UNWAIVED <promise> day_seed=<seed>: ...")
            grep -oE 'UNWAIVED [a-z_]+ day_seed=[0-9]+' job.log | sed -E 's/^UNWAIVED /promise /' >> failing.txt || true
            grep -oE 'UNWAIVED [a-z_]+' job.log | sed -E 's/^UNWAIVED //' >> promises.txt || true
          done <<< "$jobs"
          sort -u failing.txt -o failing.txt
          sort -u promises.txt -o promises.txt
          job_names=$(printf '%s\n' "$jobs" | cut -d' ' -f2- | sort -u | paste -sd, -)
          # The signature: failing tests plus broken promise NAMES (seeds change every night, the mechanism does not).
          sig_src=$( { grep -v '^promise ' failing.txt || true; sed 's/^/promise:/' promises.txt; } )
          [ -z "$sig_src" ] && sig_src="jobs:$job_names"
          sig=$(printf '%s' "$sig_src" | sha1sum | cut -c1-12)
          tests=$(sed 's/^/- `/; s/$/`/' failing.txt | head -40)
          [ -z "$tests" ] && tests="- (no failing test line found; see the failed jobs: $job_names)"
          summary="seeds=$SEEDS, generated-days=$GENERATED, surfaces=$SURFACES, ha-lifecycle=$HA"
          num=$(gh issue list --state open --label nightly-failure --search "\"nightly-signature: $sig\" in:body" \
            --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "The same failure again: $RUN_URL (commit $GITHUB_SHA). $summary.
          <!-- nightly-run: $RUN_ID -->"
          else
            gh issue create --label bug --label nightly-failure --label "severity: medium" \
              --title "Nightly failure $(date -u +%F): ${job_names:-unknown job}" \
              --body "Nightly run failed: $RUN_URL (commit $GITHUB_SHA).

          **Jobs:** $summary

          **What failed**
          $tests

          The nightly auto-diagnosis (\`.github/workflows/nightly-autofix.yml\`) investigates this issue, posts its diagnosis here, and opens a draft PR when it finds a fix. Review it and merge it yourself; nothing merges or deploys automatically.

          <!-- nightly-signature: $sig -->
          <!-- nightly-run: $RUN_ID -->"
          fi
