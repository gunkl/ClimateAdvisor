name: Hassfest

on:
  push:
    branches:
      - main
      - 0.9.x
  pull_request:
    branches:
      - main
      - 0.9.x
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Hassfest
        uses: home-assistant/actions/hassfest@master
