name: Validate and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # The checks that used to run serially in validate-and-test now run as parallel jobs; validate-and-test is the
  # gate that collects them, so branch protection keeps requiring one unchanged check name.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv (uv reads the Python version from .python-version)
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install test dependencies
        run: uv sync --locked --only-group test

      - name: Run pre-deploy validation
        run: uv run --locked --only-group test python tools/validate.py

      - name: Run linting (ruff)
        run: uv run --locked --only-group test ruff check .

      - name: Check formatting (ruff)
        run: uv run --locked --only-group test ruff format --check .

  # The unit tier in round-robin slices (CA_UNIT_SHARD, tests/conftest.py): one serial job took 8-14 min.
  # 8 slices x 4 workers (each runner has 4 CPUs): twice the workers of the first 4 x 4 layout (3.5 min, one slice
  # ~1 min behind the rest), in smaller slices so a slow test holds up less of the run.
  # To change the slice count, change the matrix list, the "/8" in the job name and CA_UNIT_SHARD, and the step name.
  unit:
    name: unit (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv (uv reads the Python version from .python-version)
        uses: astral-sh/setup-uv@v10.3.3

      - name: Run unit tests (slice ${{ matrix.shard }} of 8)
        run: python3 scripts/test.py unit
        env:
          CA_UNIT_WORKERS: "4"
          CA_UNIT_SHARD: "${{ matrix.shard }}/8"

  # Issue #1186: each changed test file must also pass ALONE (order-dependence guard).
  # No-op when no tests/test_*.py changed (e.g. a push to main).
  # Workers split one file's tests, never mix in another file: every xdist worker collects only that
  # file, so a file that passes only because another file ran first still fails here. Serial, a PR
  # touching tests/test_sim_generator.py paid ~6 min for that one file.
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # diffs against origin/main

      - name: Set up uv (uv reads the Python version from .python-version)
        uses: astral-sh/setup-uv@v10.3.3

      - name: Run changed unit test files in isolation
        run: python3 scripts/test_changed_isolated.py --base origin/main --strict
        env:
          CA_UNIT_WORKERS: "4"

  validate-and-test:
    if: always()
    needs: [lint, unit, isolated]
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Every lint, unit slice and isolation job passed
        run: |
          echo 'lint=${{ needs.lint.result }} unit=${{ needs.unit.result }} isolated=${{ needs.isolated.result }}'
          test '${{ needs.lint.result }}' = success
          test '${{ needs.unit.result }}' = success
          test '${{ needs.isolated.result }}' = success

  # Real Home Assistant tier (Issue #1102 follow-up S1). Its own job and its own
  # environment: tests/ stubs homeassistant for the whole process, and this plugin
  # auto-loads into any pytest run in the environment it is installed in.
  # Budget (02-step2-design.md section 11.2): 5 minutes target, 8 minutes hard cap. If it drifts, read the
  # --durations output below and fix the slowest step; do not raise the cap.
  ha-real:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CA_HA_WORKERS: "4"
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv (uv reads the Python version from .python-version)
        uses: astral-sh/setup-uv@v10.3.3

      - name: Run real-HA lifecycle tests
        run: python3 scripts/test.py ha --durations=15  # uv run --locked --only-group test-ha (own venv)
