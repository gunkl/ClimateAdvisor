<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Climate Advisor - Prediction accuracy</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --ink: #0b0b0b; --ink2: #52514e; --muted: #6b6a66;
    --rule: #e4e3df; --chip: #f1f0ec; --s1: #1a64ba; --s2: #b3461a; --heat: #e34948;
    --warn: #a35400; --ok: #17703f; --sel: rgba(42, 120, 214, 0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --panel: #1f1f1d; --ink: #f0efec; --ink2: #c3c2b7; --muted: #a3a29b;
      --rule: #3a3936; --chip: #2c2c2a; --s1: #5aa0f0; --s2: #f08a5d; --heat: #e66767;
      --warn: #f0a63c; --ok: #4cc38a; --sel: rgba(90, 160, 240, 0.18);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    padding: 0 0 40px; overflow-x: hidden;
  }
  a { color: var(--s1); }
  main { max-width: 1240px; margin: 0 auto; padding: 14px 16px 0; display: flex; flex-direction: column; gap: 12px; }
  header.top { background: var(--panel); border-bottom: 1px solid var(--rule); }
  .top-in { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
  .brand { font-size: 17px; font-weight: 700; }
  .card { background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  h1, h2 { margin: 0; font-size: 16px; }
  .sub { font-size: 12px; color: var(--muted); }
  .row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  /* the view's own styles (controls, chart, tiles, table) come with pa_view.js, scoped to .pa-view (Issue #1497) */
  .zone-sel { min-height: 36px; font: inherit; font-size: 13px; color: var(--ink); }
  /* Same look as the new dashboard's .btn ("Back to classic" in new_dashboard.html) */
  .btn {
    display: inline-flex; align-items: center; min-height: 36px; padding: 0 14px; border-radius: 8px;
    border: 1px solid var(--rule); background: var(--panel); color: var(--ink); font-size: 13px;
    text-decoration: none; cursor: pointer; white-space: nowrap;
  }
  a.btn:hover { color: var(--ink); }
  a.btn:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
  .zone-sel { border-radius: 8px; border: 1px solid var(--rule); background: var(--panel); padding: 0 8px; }
  button:focus-visible, select:focus-visible, canvas:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
  .grow { flex: 1 1 0; }
  .small { font-size: 12px; color: var(--ink2); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  [hidden] { display: none !important; }
</style>
<!-- i18n.js: pa_view.js (shared with the new dashboard) reads window.CA_I18N; loaded here so it is defined even
     though this stand-alone page's own text stays English (no data-i18n attributes are used on this page). -->
<script src="i18n.js"></script>
<!-- Bundled libraries only, same files as index.html (no CDN) -->
<script src="hammer.min.js"></script>
<script src="chart.umd.min.js"></script>
<script src="chartjs-plugin-zoom.min.js"></script>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">Climate Advisor</div>
    <label class="row small" for="zone-select" id="zone-wrap" hidden>Zone
      <select id="zone-select" class="zone-sel"></select>
    </label>
    <!-- Back to whichever dashboard this browser uses: entry.html applies the remembered
         'climate_advisor_dashboard' choice (classic -> index.html, otherwise new_dashboard.html). -->
    <a class="btn" href="entry.html" id="back-link">Back to dashboard</a>
    <div class="grow"></div>
  </div>
</header>
<main>
  <!-- Issue #1497: the view (controls, chart, tiles, "How each model has scored") is the shared pa_view.js, which the
       new dashboard's Analysis tab mounts too (never in a frame, Issue #1491). This page adds the header around it. -->
  <div id="pa-root"></div>
</main>

<script src="pa_view.js"></script>
<script>
(function () {
  'use strict';
  var ZONE_STORAGE_KEY = 'climate_advisor_selected_zone'; // same key as index.html and the dashboards
  function $(id) { return document.getElementById(id); }
  var zone = null;
  try { zone = localStorage.getItem(ZONE_STORAGE_KEY) || null; } catch (e) { zone = null; }
  try {
    var qz = new URLSearchParams(location.search).get('zone');
    if (qz) zone = qz;
  } catch (e) { /* ignore */ }
  // Opened from classic (?from=classic): go back to classic even if nothing is remembered (classic may have been
  // opened for one visit with ?classic=1). The rest of the query is kept; otherwise entry.html picks the dashboard.
  try {
    var bq = new URLSearchParams(location.search);
    if (bq.get('from') === 'classic') {
      bq.delete('from');
      var rest = bq.toString();
      $('back-link').setAttribute('href', 'index.html' + (rest ? '?' + rest : ''));
    }
  } catch (e) { /* keep entry.html */ }
  // The zone picker: shown only with more than one zone
  function onZones(zones, current) {
    var sel = $('zone-select'); sel.textContent = '';
    zones.forEach(function (z) {
      var o = document.createElement('option');
      o.value = z.entry_id; o.textContent = z.title || z.entry_id;
      sel.appendChild(o);
    });
    sel.value = current;
    $('zone-wrap').hidden = zones.length <= 1;
  }
  $('zone-select').addEventListener('change', function (ev) {
    try { localStorage.setItem(ZONE_STORAGE_KEY, ev.target.value); } catch (e) { /* ignore */ }
    window.CAPredictionAccuracy.setZone(ev.target.value);
  });
  window.CAPredictionAccuracy.mount($('pa-root'), { zone: zone, onZones: onZones });
})();
</script>
</body>
</html>
