respond_to_suggestion:
  name: Respond to suggestion
  description: Accept or dismiss a learning suggestion from Climate Advisor.
  fields:
    entry_id:
      name: Zone
      description: >-
        The Climate Advisor zone (config entry) this call applies to. Required
        since Issue #796 — with more than one zone configured, HA's service
        registry has no other way to know which zone a call is meant for.
      required: true
      example: "01JABCDEFGHJKMNPQRSTVWXYZ"
      selector:
        config_entry:
          integration: climate_advisor
    action:
      name: Action
      description: Whether to accept or dismiss the suggestion.
      required: true
      example: "accept"
      selector:
        select:
          options:
            - "accept"
            - "dismiss"
    suggestion_key:
      name: Suggestion key
      description: The key identifying the suggestion to respond to.
      required: true
      example: "bedtime_setback_override"
      selector:
        text:

force_reclassify:
  name: Force reclassify
  description: Force Climate Advisor to re-fetch forecast data and reclassify the day. Useful for debugging.
  fields:
    entry_id:
      name: Zone
      description: >-
        The Climate Advisor zone (config entry) this call applies to. Required
        since Issue #796 — with more than one zone configured, HA's service
