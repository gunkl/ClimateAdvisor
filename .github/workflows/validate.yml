name: Validate and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up uv (uv reads the Python version from .python-version)
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install test dependencies
        run: uv sync --locked --only-group test

      - name: Run pre-deploy validation
        run: uv run --locked --only-group test python tools/validate.py

      - name: Run linting (ruff)
        run: uv run --locked --only-group test ruff check .

      - name: Check formatting (ruff)
        run: uv run --locked --only-group test ruff format --check .

      - name: Run unit tests
        run: python3 scripts/test.py unit

  # Real Home Assistant tier (Issue #1102 follow-up S1). Its own job and its own
  # environment: tests/ stubs homeassistant for the whole process, and this plugin
  # auto-loads into any pytest run in the environment it is installed in.
  # Budget (02-step2-design.md section 11.2): 5 minutes target, 8 minutes hard cap. If it drifts, read the
  # --durations output below and fix the slowest step; do not raise the cap.
  ha-real:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CA_HA_WORKERS: "4"
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up uv (uv reads the Python version from .python-version)
        uses: astral-sh/setup-uv@v10.2.0

      - name: Run real-HA lifecycle tests
        run: python3 scripts/test.py ha --durations=15  # uv run --locked --only-group test-ha (own venv)
