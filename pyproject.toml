[project]
name = "climate-advisor"
version = "0.0.0"  # not a distributable package (tool.uv.package = false); real version lives in manifest.json
requires-python = ">=3.14.2"

# Single source of test dependencies (Issue #1126). Two groups that must never share an
# environment: tests/ stubs homeassistant for the whole process, while the real-HA plugin
# auto-loads into any pytest run. Always sync with `uv sync --only-group <group>`.
[dependency-groups]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0,<0.17",
    "pre-commit>=4.0",
    # zoneinfo needs a tz database; absent on Windows (Issue #906)
    "tzdata>=2024.1",
    "voluptuous>=0.14",
    # property-based random-day generator (Issue #1128 Step 3, I3)
    "hypothesis>=6.100",
]
test-ha = [
    # Pinned to the plugin release that pins HA 2026.10.4 (needs Python >=3.14.2).
    "pytest-homeassistant-custom-component==0.13.375",
    # Snapshot tests of occupant-facing text (Issue #945). Also installed transitively by the
    # plugin; named here so a plugin upgrade that drops it cannot silently remove it.
    "syrupy>=5",
]

[tool.uv]
package = false
conflicts = [[{ group = "test" }, { group = "test-ha" }]]

[tool.uv.workspace]
# Explicit workspace root so uv never walks up into an enclosing project (e.g. a git
# worktree nested under .claude/worktrees/ inside another checkout).
members = []

[tool.ruff]
target-version = "py314"
line-length = 120
# plans/ holds design documents whose fenced Python blocks are sketches, not code ruff should reformat
exclude = [".claude", "plans"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "T20", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20"]
"tools/*" = ["T20"]
"scripts/*" = ["T20"]
# dev_tools/ha_test_integrations/ — never-shipped local test tooling (Issue #809),
# same rationale as tools/*: print() output is the point of a manual verification
# script, not a lint smell.
"dev_tools/*" = ["T20"]
# take_screenshots.py runs its own private asyncio loop for Playwright, not Home
# Assistant's shared event loop — the ASYNC240 hazard (stalling a live production
# loop) doesn't apply to a one-off local CLI script.
"tools/take_screenshots.py" = ["ASYNC240"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
