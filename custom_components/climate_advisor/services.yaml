dump_diagnostics:
  name: Dump diagnostics
  description: >-
    Log a comprehensive diagnostic snapshot of Climate Advisor's internal state
    for troubleshooting. Output is logged at INFO level — check Home Assistant
    logs to view the result.
  fields:
    entry_id:
      name: Zone
      description: >-
        The Climate Advisor zone (config entry) this call applies to. Required
        since Issue #796 — with more than one zone configured, HA's service
        registry has no other way to know which zone a call is meant for.
      required: true
      example: "01JABCDEFGHJKMNPQRSTVWXYZ"
      selector:
        config_entry:
          integration: climate_advisor

reset_learning_data:
  name: Reset learning data
  description: >-
    Reset some or all of Climate Advisor's learned data.
    Use after changing HVAC equipment, moving to a new location, or to start fresh.
  fields:
    entry_id:
      name: Zone
      description: >-
        The Climate Advisor zone (config entry) this call applies to. Required
        since Issue #796 — with more than one zone configured, HA's service
        registry has no other way to know which zone a call is meant for.
        Double check this before calling — this service is destructive.
      required: true
      example: "01JABCDEFGHJKMNPQRSTVWXYZ"
      selector:
        config_entry:
          integration: climate_advisor
    scope:
      name: Scope
      description: >-
        What data to reset. "all" wipes everything. "thermal_model" clears HVAC session
        observations. "weather_bias" clears forecast accuracy records. "suggestions" allows
        previously dismissed suggestions to reappear.
      required: false
      default: "all"
      example: "thermal_model"
      selector:
        select:
          options:
            - "all"
            - "thermal_model"
            - "weather_bias"
            - "suggestions"
