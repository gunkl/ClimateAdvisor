# Issue #1341: names, descriptions and select labels live in strings.json (``services`` and ``selector``),
# translated by Home Assistant. This file only holds what is not text: which fields exist, whether they are
# required, their defaults, examples and selector types.

respond_to_suggestion:
  fields:
    entry_id:
      required: true
      example: "01JABCDEFGHJKMNPQRSTVWXYZ"
      selector:
        config_entry:
          integration: climate_advisor
    action:
      required: true
      example: "accept"
      selector:
        select:
          translation_key: suggestion_action
          options:
            - "accept"
            - "dismiss"
    suggestion_key:
      required: true
      example: "bedtime_setback_override"
      selector:
        text:

force_reclassify:
  fields:
    entry_id:
      required: true
      example: "01JABCDEFGHJKMNPQRSTVWXYZ"
      selector:
        config_entry:
          integration: climate_advisor

resend_briefing:
  fields:
    entry_id:
      required: true
      example: "01JABCDEFGHJKMNPQRSTVWXYZ"
      selector:
        config_entry:
          integration: climate_advisor

dump_diagnostics:
  fields:
    entry_id:
      required: true
      example: "01JABCDEFGHJKMNPQRSTVWXYZ"
      selector:
        config_entry:
          integration: climate_advisor

reset_learning_data:
  fields:
    entry_id:
      required: true
      example: "01JABCDEFGHJKMNPQRSTVWXYZ"
      selector:
        config_entry:
          integration: climate_advisor
    scope:
      required: false
      default: "all"
      example: "thermal_model"
      selector:
        select:
          translation_key: reset_scope
          options:
            - "all"
            - "thermal_model"
            - "weather_bias"
            - "suggestions"
