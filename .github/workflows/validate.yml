name: Validate and Test

on:
  push:
    branches:
      - main
      - 0.8.x
  pull_request:
    branches:
      - main
      - 0.8.x

jobs:
  # The checks that used to run serially in validate-and-test now run as parallel jobs; validate-and-test is the
  # gate that collects them, so branch protection keeps requiring one unchanged check name.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv (uv reads the Python version from .python-version)
        uses: astral-sh/setup-uv@v10.4.0

      - name: Install test dependencies
        run: uv sync --locked --only-group test

      - name: Run pre-deploy validation
        run: uv run --locked --only-group test python tools/validate.py

      - name: Run linting (ruff)
        run: uv run --locked --only-group test ruff check .

      - name: Check formatting (ruff)
        run: uv run --locked --only-group test ruff format --check .

      # Issue #1341: the dashboard's JS i18n runtime must render every conformance row exactly as Python does.
      # The fixture's expected text embeds one ICU/CLDR release (tests/fixtures/i18n_conformance.json header), so Node
      # is pinned: 22.12.0 ships ICU 76.1. tests/i18n_conformance.mjs fails with a clear message if the ICU differs.
      - name: Set up Node.js (pinned for the i18n ICU data)
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0

      - name: i18n runtime checks and Python/JS conformance (node)
        run: |
          node --version
          node tests/i18n_runtime.mjs
          node tests/i18n_conformance.mjs
          node tests/i18n_dashboard.mjs

  # The unit tier in round-robin slices (CA_UNIT_SHARD, tests/conftest.py): one serial job took 8-14 min.
  # 8 slices x 4 workers (each runner has 4 CPUs): twice the workers of the first 4 x 4 layout (3.5 min, one slice
  # ~1 min behind the rest), in smaller slices so a slow test holds up less of the run.
  # To change the slice count, change the matrix list, the "/8" in the job name and CA_UNIT_SHARD, and the step name.
  # Each slice also collects line and branch coverage for the per-module coverage ratchet (job `coverage`, Issue
  # #1644). Coverage on Python 3.14 uses sys.monitoring, so it adds little to a slice's time.
  unit:
    name: unit (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv (uv reads the Python version from .python-version)
        uses: astral-sh/setup-uv@v10.4.0

      - name: Run unit tests (slice ${{ matrix.shard }} of 8)
        run: |
          mkdir -p reports
          python3 scripts/test.py unit --cov=custom_components/climate_advisor --cov-branch --cov-report=
        env:
          CA_UNIT_WORKERS: "4"
          CA_UNIT_SHARD: "${{ matrix.shard }}/8"
          COVERAGE_FILE: "reports/coverage.unit.${{ matrix.shard }}"

      - name: Upload this slice's coverage data
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-unit-${{ matrix.shard }}
          path: reports/coverage.unit.${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 3

  # Issue #1186: each changed test file must also pass ALONE (order-dependence guard).
  # No-op when no tests/test_*.py changed (e.g. a push to main).
  # Workers split one file's tests, never mix in another file: every xdist worker collects only that
  # file, so a file that passes only because another file ran first still fails here. Serial, a PR
  # touching tests/test_sim_generator.py paid ~6 min for that one file.
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # diffs against origin/main

      - name: Set up uv (uv reads the Python version from .python-version)
        uses: astral-sh/setup-uv@v10.4.0

      - name: Run changed unit test files in isolation
        run: python3 scripts/test_changed_isolated.py --base "origin/${{ github.base_ref || github.ref_name }}" --strict
        env:
          CA_UNIT_WORKERS: "4"

  # Issue #1644 (Silver test-coverage): every unit and real-HA slice's coverage, combined, checked per module against
  # tools/coverage_floors.json (a module may not fall below its floor; tools/coverage_ratchet.py). The per-module
  # table goes to the job summary. Runs only when every slice passed: a failed slice's data would be incomplete.
  coverage:
    needs: [unit, ha-slice]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv (uv reads the Python version from .python-version)
        uses: astral-sh/setup-uv@v10.4.0

      - name: Install test dependencies (coverage)
        run: uv sync --locked --only-group test

      - name: Download every slice's coverage data
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: coverage-*
          path: reports
          merge-multiple: true

      - name: Combine both tiers
        run: |
          uv run --locked --only-group test coverage combine --data-file=reports/coverage.all reports/coverage.unit.* reports/coverage.ha.*
          uv run --locked --only-group test coverage json --data-file=reports/coverage.all -o reports/coverage.json

      - name: Per-module coverage ratchet
        run: python3 tools/coverage_ratchet.py check reports/coverage.json --summary "$GITHUB_STEP_SUMMARY"

  # Issue #1645 (Platinum strict-typing): strict mypy over the package, in the real-HA environment (mypy has to see the
  # real Home Assistant). Modules listed in .strict-typing must stay clean, a module that becomes clean must be added,
  # nothing may leave the list, and new modules must pass from day one (tools/typing_ratchet.py).
  typing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # compares .strict-typing and the module list with the base branch

      - name: Set up uv (uv reads the Python version from .python-version)
        uses: astral-sh/setup-uv@v10.4.0

      - name: Strict typing ratchet (mypy)
        run: >
          uv run --locked --only-group test-ha python tools/typing_ratchet.py
          --base "origin/${{ github.base_ref || github.ref_name }}" --summary "$GITHUB_STEP_SUMMARY"

  validate-and-test:
    if: always()
    needs: [lint, unit, isolated, coverage, typing]
    runs-on: ubuntu-latest
    # Issue #1745: contents to check out the report script, actions to read this run's job times. Reporting only.
    permissions:
      contents: read
      actions: read

    steps:
      # The checkout and the report only add information: if either breaks, the verdict step still runs and decides.
      - name: Checkout code
        uses: actions/checkout@v7
        continue-on-error: true

      # A job that hit its timeout-minutes is reported as "cancelled"; this names it and says how long it ran.
      - name: Name any job that timed out
        if: always()
        run: bash scripts/ci_job_times.sh timeouts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          LIMITS: |
            lint=5
            unit (*/8)=10
            isolated=15
            coverage=5
            typing=10
            ha-real (*/4)=8

      - name: Every lint, unit slice, isolation, coverage and typing job passed
        run: |
          echo 'lint=${{ needs.lint.result }} unit=${{ needs.unit.result }} isolated=${{ needs.isolated.result }}'
          echo 'coverage=${{ needs.coverage.result }} typing=${{ needs.typing.result }}'
          test '${{ needs.lint.result }}' = success
          test '${{ needs.unit.result }}' = success
          test '${{ needs.isolated.result }}' = success
          test '${{ needs.coverage.result }}' = success
          test '${{ needs.typing.result }}' = success

  # Real Home Assistant tier (Issue #1102 follow-up S1). Its own job and its own
  # environment: tests/ stubs homeassistant for the whole process, and this plugin
  # auto-loads into any pytest run in the environment it is installed in.
  # Budget (02-step2-design.md section 11.2): 5 minutes target, 8 minutes hard cap. If it drifts, read the
  # --durations output below and fix the slowest step; do not raise the cap.
  # Round-robin slices like the unit tier (CA_HA_SHARD, tools/pytest_shard.py): one job took ~3 min, spread over
  # many ~10 s tests (mostly the golden replays). To change the slice count, change the matrix list, the "/4" in the
  # job name and CA_HA_SHARD, and the step name together.
  # Each slice also collects coverage for the per-module coverage ratchet (job `coverage`, Issue #1644).
  ha-slice:
    name: ha-real (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CA_HA_WORKERS: "4"
      CA_HA_SHARD: "${{ matrix.shard }}/4"
      COVERAGE_FILE: "reports/coverage.ha.${{ matrix.shard }}"
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv (uv reads the Python version from .python-version)
        uses: astral-sh/setup-uv@v10.4.0

      - name: Run real-HA lifecycle tests (slice ${{ matrix.shard }} of 4)
        run: |  # uv run --locked --only-group test-ha (own venv)
          mkdir -p reports
          python3 scripts/test.py ha --durations=15 --cov=custom_components/climate_advisor --cov-branch --cov-report=

      - name: Upload this slice's coverage data
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-ha-${{ matrix.shard }}
          path: reports/coverage.ha.${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 3

  # The required check: passes only when every real-HA slice passed (branch protection requires this name).
  ha-real:
    if: always()
    needs: [ha-slice]
    runs-on: ubuntu-latest
    # Issue #1745: contents to check out the report script, actions to read this run's job times. Reporting only.
    permissions:
      contents: read
      actions: read

    steps:
      # The checkout and the report only add information: if either breaks, the verdict step still runs and decides.
      - name: Checkout code
        uses: actions/checkout@v7
        continue-on-error: true

      # A slice that hit its 8-minute cap is reported as "cancelled"; this names it and says how long it ran.
      - name: Name any slice that timed out
        if: always()
        run: bash scripts/ci_job_times.sh timeouts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          LIMITS: |
            lint=5
            unit (*/8)=10
            isolated=15
            coverage=5
            typing=10
            ha-real (*/4)=8

      - name: Every real-HA slice passed
        run: |
          echo 'ha-slice=${{ needs.ha-slice.result }}'
          test '${{ needs.ha-slice.result }}' = success

  # Issue #1745: warn (never fail) when a job in this run used more than 75% of its timeout-minutes, so a job that is
  # creeping toward its cap is seen while it still passes (#1743 was found only after slices hit the 8-minute cap).
  # The limits below are the jobs' timeout-minutes; tests/test_ci_job_times_1745.py keeps them equal.
  ci-timing:
    if: always()
    needs: [lint, unit, isolated, coverage, typing, ha-slice]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true  # a warning job: even a broken checkout or a timeout must not turn the run red
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Warn about jobs near their time limit
        run: bash scripts/ci_job_times.sh warn
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          LIMITS: |
            lint=5
            unit (*/8)=10
            isolated=15
            coverage=5
            typing=10
            ha-real (*/4)=8
