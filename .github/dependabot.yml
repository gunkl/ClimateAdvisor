# Weekly dependency updates, grouped so each week is at most a few PRs.
# The HA test stack moves together: a pytest-homeassistant-custom-component bump
# pulls a new homeassistant (and its pinned Pillow), which is what clears the
# Pillow alerts once a release pinning HA 2026.11+ is published.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      ha-test-stack:
        patterns:
          - "pytest-homeassistant-custom-component"
          - "homeassistant"
          - "syrupy"
      test-tools:
        patterns:
          - "*"
        exclude-patterns:
          - "pytest-homeassistant-custom-component"
          - "homeassistant"
          - "syrupy"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
