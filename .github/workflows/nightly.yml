name: Nightly generated days and real-HA tier

# Issue #1128 I11 / epic #1125 Step 3. The unit tier runs a small fixed sample of generated
# household days on every PR; this workflow explores far more of them with fresh seeds, and
# re-runs the real Home Assistant tier, so a regression that only a rare day triggers is found
# overnight instead of by a customer. A failing run uploads the replayable scenario files.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      seeds:
        description: "Number of master seeds"
        default: "12"
      days:
        description: "Generated days per master seed"
        default: "250"

jobs:
  # Issue #1278: the seeds are picked once and shared, so the P1-P7 and P8 jobs judge the same master seeds.
  seeds:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.seeds.outputs.list }}
      days: ${{ steps.seeds.outputs.days }}
    steps:
      - name: Pick fresh master seeds (printed so a failure is replayable)
        id: seeds
        env:
          INPUT_SEEDS: ${{ github.event.inputs.seeds }}
          INPUT_DAYS: ${{ github.event.inputs.days }}
        run: |
          count="${INPUT_SEEDS:-12}"
          days="${INPUT_DAYS:-250}"
          case "$count" in ''|*[!0-9]*) echo "seeds must be a positive integer, got '$count'" >&2; exit 1;; esac
          case "$days" in ''|*[!0-9]*) echo "days must be a positive integer, got '$days'" >&2; exit 1;; esac
          if [ "$count" -lt 1 ] || [ "$count" -gt 100 ] || [ "$days" -lt 1 ] || [ "$days" -gt 5000 ]; then
            echo "seeds must be 1-100 and days 1-5000" >&2; exit 1
          fi
          base=$(( (GITHUB_RUN_NUMBER % 1000) * 1000 ))
          list=""
          for i in $(seq 1 "$count"); do list="$list $((base + i))"; done
          echo "list=${list# }" >> "$GITHUB_OUTPUT"
          echo "days=$days" >> "$GITHUB_OUTPUT"
          echo "Master seeds: ${list# }"

  # Issue #1278: 12 x 250 days took 76 min on a hosted runner (about 1.5 s/day). P8 used to run after it in the
  # same job and would have pushed the job past its cap, so it is its own job now (run in parallel), and the cap
  # leaves headroom. If a run nears it, read the per-seed timings and peak_rss in the log; do not just raise it.
  generated-days:
    needs: seeds
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      issues: read  # Issue #1153: the waiver ledger checks each waiver's issue is still open

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up uv (uv reads the Python version from .python-version)
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install test dependencies
        run: uv sync --locked --only-group test

      # Issue #1153: a known hit is tolerated only through tools/sim_harness/nightly_waivers.json - issue-linked,
      # expiring, matched on mechanism (never seed). A closed issue, a passed expiry or a waiver whose hit no
      # longer occurs fails this step. GITHUB_SHA / GITHUB_REPOSITORY are set by Actions; the token reads issues.
      - name: Generated days judged by the household promises (P1-P7) and the waiver ledger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          uv run --locked --only-group test python tools/simulate.py
          --generate ${{ needs.seeds.outputs.days }}
          --seeds ${{ needs.seeds.outputs.list }}
          --waiver-ledger tools/sim_harness/nightly_waivers.json
          --issue-state github

      - name: Upload failing scenarios
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: generated-failures
          path: tools/simulations/generated/failures/
          if-no-files-found: ignore
          retention-days: 30

  surfaces:
    needs: seeds
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up uv (uv reads the Python version from .python-version)
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install test dependencies
        run: uv sync --locked --only-group test

      - name: Generated days judged by surfaces_agree (P8, ratcheted)
        run: >
          uv run --locked --only-group test python tools/simulate.py
          --surfaces --generate 50
          --seeds ${{ needs.seeds.outputs.list }}

  ha-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up uv (uv reads the Python version from .python-version)
        uses: astral-sh/setup-uv@v10.2.0

      - name: Run real-HA lifecycle tests
        run: python3 scripts/test.py ha  # uv run --locked --only-group test-ha (own venv)

  # Issue #1278: the nightly failed four nights running and nobody noticed, because a failed scheduled
  # run only shows in the Actions tab. Open one tracking issue on the first failure and comment on it
  # for every later one, until someone closes it. A runner killed for memory reports "failure" or
  # "cancelled", so both count.
  report-failure:
    needs: [seeds, generated-days, surfaces, ha-lifecycle]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the nightly-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GENERATED: ${{ needs.generated-days.result }}
          SURFACES: ${{ needs.surfaces.result }}
          HA: ${{ needs.ha-lifecycle.result }}
        run: |
          title="Nightly generated-days / real-HA run failing"
          body="Nightly run failed: $RUN_URL (commit $GITHUB_SHA). generated-days=$GENERATED, surfaces=$SURFACES, ha-lifecycle=$HA."
          num=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$body"
          else
            gh issue create --title "$title" --body "$body

          Close this issue once the nightly is green again; the next failure opens a new one."
          fi
