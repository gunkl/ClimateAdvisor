name: HACS Validation

on:
  push:
    branches:
      - main
      - 0.8.x
  pull_request:
    branches:
      - main
      - 0.8.x
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  hacs:
    name: HACS Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: HACS Action
        uses: hacs/action@main
        with:
          category: integration
