[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = .
addopts = -v --tb=short --strict-markers
timeout = 60
# Issue #1518: 'thread' ends a test process that hangs where the default SIGALRM cannot interrupt it (seen under
# heavy load: a shard sat 45 min and all night on one whole-house-fan test). Under xdist (CA_HA_WORKERS set) the worker
# is replaced and the run goes on; a serial run (no CA_HA_WORKERS) aborts at the first timeout instead.
timeout_method = thread
markers =
    house: uses the full house fixture (real HA + simulated thermostat + weather + fan)
    goldens: real-HA replay of the golden scenarios (deselect with -m "not goldens")
    snapshot: syrupy snapshot of occupant-facing text
    slow: takes more than 5 s; listed in the PR
